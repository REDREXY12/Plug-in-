name: Build YouTuberRecs Plugin

'on':
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install Gradle
    run: |
      sudo apt-get update
      sudo apt-get install -y gradle

  - name: Build plugin
    run: gradle --no-daemon build

  - name: Upload plugin JAR
    uses: actions/upload-artifact@v4
    with:
      name: YouTuberRecs-Plugin
      path: build/libs/*.jar
      if-no-files-found: error
