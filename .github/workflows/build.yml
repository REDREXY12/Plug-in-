name: Build YouTuber Recs

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Build plugin
    run: gradle clean build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: YouTuberRecs-JAR
      path: build/libs/*.jar
      if-no-files-found: error
