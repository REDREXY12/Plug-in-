name: Build Plugin

'on':
push:
branches: [main]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Build plugin
    run: |
      sudo apt-get update
      sudo apt-get install -y gradle
      gradle build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: YouTuberRecs
      path: build/libs/*.jar
