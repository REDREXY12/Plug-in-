name: Build YouTuber Recs Plugin
on:
workflow_dispatch:
push:
branches:
- main
permissions:
contents: read
jobs:
build:
runs-on: ubuntu-latest
steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Check project files
    run: |
      echo "Checking Java source..."
      find . -name "YouTuberRecs.java"
      echo "Checking plugin.yml..."
      find . -name "plugin.yml"

  - name: Build plugin
    run: gradle --no-daemon clean build

  - name: Upload compiled JAR
    uses: actions/upload-artifact@v4
    with:
      name: YouTuberRecs-JAR
      path: build/libs/*.jar
      if-no-files-found: error
